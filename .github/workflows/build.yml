name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum the plugin targets; 21 is what a Minecraft 1.21 server runs on.
        java: ['17', '21']

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build
        run: mvn -B --no-transfer-progress package

      - name: Upload plugin jar
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: Landlord.jar
          path: target/Landlord.jar
          if-no-files-found: error
